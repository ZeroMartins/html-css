<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 200px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do

        <!-- Tamanho padrão 300x150 -->
       <iframe src="https://www.cursoemvideo.com" frameborder="0" scolling="">
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
       </iframe> 

       para aprender a programar.
    </p>   
    <p>
        O repósitorio do Guanabara

        <iframe src="https://g1.globo.com/" frameborder="0">
            no <a href="https://translate.google.com.br/?sl=auto&tl=pt&op=translate" target="_blank">Google</a>
        </iframe>

        tambem é bem legal!
    </p>
</body>
</html>
