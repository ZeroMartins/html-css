<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {
            border: 2px solid black;
            padding: 8px;
        } 
        
       .destaque {
            background-color: red;
        }

        col.cnome {
            background-color: #00d9ff;
        }

        col.csexo {
            background-color: green;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
         <tr>
            <td>Cláudia</td>
            <td>F</td>
            <td>32</td>
            <td>Estilista</td>
        </tr>
         <tr>
            <td>Fernando</td>
            <td>M</td>
            <td>34</td>
            <td class="destaque">Professor</td>
        </tr>
         <tr>
            <td>Danilo</td>
            <td>M</td>
            <td>29</td>
            <td>Médico</td>
        </tr>
         <tr>
            <td>Juliana</td>
            <td>F</td>
            <td>26</td>
            <td>Nutricionista</td>
        </tr>
         <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>38</td>
            <td>Programador</td>
        </tr>
    </table>

    
</body>
</html>
