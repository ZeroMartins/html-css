<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*  SELETORES PERSONALIZADOS
            #    = id
            .    = class
            :    = pseudo-class
            ::   = pseudo-element
            >    = children
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: rgb(11, 127, 221);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred
        }

        a:hover {
            color: #000000;
            text-decoration: underline;
        }

        a:active {
            color: #800000;
        }   

        .especial {
            background-color: #d5585870;
        }

        .especial::before {
            content: '⥤ ';
        }

        .especial::after {
            content: ' ⥢';
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/ZeroMartins" target="_blank" class="especial">Repositório Github</a></li>
        <li><a href="https://x.com/AloisioMartin13" target="_blank" class="especial">Perfil Twitter</a></li>
        <li><a href="https://www.linkedin.com/in/aloisio-martins-41b24b271" target="_blank">Linkedin</a></li>
    </ul>
</body>
</html>
