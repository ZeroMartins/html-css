<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: rgb(255, 99, 82);
            
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: rgb(57, 203, 239);
            color: rgb(0, 0, 0);
            border: 1.5px solid rgb(0, 0, 0);
            text-align: center;
            padding: 1.5em;
            flex-basis: 200px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">Outro conteúdo</div>
        <div class="item">C</div>
        <div class="item">Conteúdo um pouco maior</div>
        <div class="item">E</div>
        <div class="item">Um conteúdo que ocupa um maior espaço.</div>
        <div class="item">G</div>
    </div>
</body>
</html>
